version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethio_exam_hall_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ethio_exam_hall
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - CORS_ORIGIN=*
      - JWT_SECRET=ethio_exam_hall_jwt_super_secret_dev_key_2026
      - JWT_EXPIRES_IN=7d
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ethio_exam_hall_backend_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ethio_exam_hall
    volumes:
      - pgdata_standalone:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ethio_exam_hall"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_standalone:

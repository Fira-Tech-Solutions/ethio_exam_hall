<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000d23" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ethio Exam" />
    <meta name="description" content="Ethiopia's national examination preparation platform. University Exit, Aviation Cadet, GAT, and more." />
    <title>Ethio Exam Hall • Ethiopian National Examination &amp; Aviation Platform</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- Google Fonts: Manrope, Inter & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Safe-area CSS custom properties (for iOS notch / Android cutout) -->
    <style>
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
      }
      /* Prevent double-tap zoom on interactive elements */
      button, a, label, input, select, textarea {
        touch-action: manipulation;
      }
      /* Smooth scrolling globally */
      html { scroll-behavior: smooth; }
      /* Hide scrollbar on filter pills while keeping scroll */
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body class="bg-background font-inter text-on-surface antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Service Worker: Only in production, auto-purged on localhost/dev to prevent stale UI caching -->
    <script>
      if ('serviceWorker' in navigator) {
        const isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocalDev) {
          // Immediately unregister all active service workers and clear stale caches on dev
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
              console.log('[SW] Dev mode: Unregistered stale Service Worker');
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (const name of names) {
                caches.delete(name);
                console.log('[SW] Dev mode: Cleared stale cache:', name);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(
              (reg) => console.log('[SW] Registered, scope:', reg.scope),
              (err) => console.warn('[SW] Registration failed:', err)
            );
          });
        }
      }
    </script>
  </body>
</html>

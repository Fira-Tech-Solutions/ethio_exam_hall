version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ethio_exam_hall_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ethio_exam_hall}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ethio_exam_hall}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ethio_exam_hall_pgdata
